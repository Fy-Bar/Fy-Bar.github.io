<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Blogsite</title>
    <style>
        /* Basis-Einstellungen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        /* Navigationsleiste */
        header {
            background: #ffffff;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d89ef;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #2d89ef;
        }

        /* Hero-Bereich */
        .hero {
            background: linear-gradient(135deg, #2d89ef, #00d2ff);
            color: white;
            padding: 100px 10%;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #2d89ef;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* Features-Bereich */
        .container {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #2d89ef;
        }

        /* Fußzeile */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 80px;
        }

        /* Responsive Anpassung für Handys */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MeinProjekt</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Über uns</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Willkommen auf meiner Website für einen Blog</h1>
        <p>Ein modernes, sauberes Design für meinen Blog</p>
        <a href="#" class="btn">Jetzt starten</a>
    </section>


    <footer>
        <p>&copy; 2026 MeinProjekt. Erstellt von TYatse und Fy-Bar.</p>
    </footer>

</body>
</html>
